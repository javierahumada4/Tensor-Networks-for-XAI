name: confirm-adbench-mps-hyperparameters

on:
  pull_request:
    paths:
      - "confirm_adbench_mps.py"
      - "screen_adbench_mps.py"
      - "mps.py"
      - "dmrg_trainer.py"
      - ".github/workflows/confirm-adbench-mps.yml"
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "numpy>=1.26" "pandas>=2.0"
      - name: Prepare datasets
        run: python prepare_adbench.py artifacts/adbench --cache-dir .cache/adbench --seed 123 --bins 8
      - name: Confirm common hyperparameters
        run: |
          python confirm_adbench_mps.py \
            artifacts/adbench \
            outputs/adbench_confirmation \
            --batch-size 1024 \
            --loops 10 \
            --batches-per-loop 24 \
            --seed 123
      - name: Upload confirmation results
        uses: actions/upload-artifact@v4
        with:
          name: adbench-mps-hyperparameter-confirmation
          path: outputs/adbench_confirmation
          retention-days: 90
