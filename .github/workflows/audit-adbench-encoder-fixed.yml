name: audit-adbench-encoder-fixed

on:
  pull_request:
    paths:
      - "audit_adbench_encoder.py"
      - ".github/workflows/audit-adbench-encoder-fixed.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "numpy>=1.26" "pandas>=2.0" "scikit-learn>=1.4"
      - name: Regenerate ADBench with corrected encoder
        run: |
          python prepare_adbench.py artifacts/adbench \
            --cache-dir .cache/adbench \
            --seed 123 \
            --bins 8
      - name: Audit independent baseline
        run: |
          python audit_adbench_encoder.py \
            artifacts/adbench \
            outputs/adbench_encoder_audit \
            --previous-results results/adbench_detection.csv
      - uses: actions/upload-artifact@v4
        with:
          name: adbench-corrected-encoder-audit
          path: |
            outputs/adbench_encoder_audit
            artifacts/adbench
          if-no-files-found: error
          retention-days: 90\non:\n  workflow_dispatch:\n
