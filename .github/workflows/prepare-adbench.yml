name: prepare-adbench-artifacts

on:
  push:
    branches:
      - paper-mps-clean
    paths:
      - "prepare_adbench.py"
      - "prepare_dataset.py"
      - "encoder.py"
      - "data_artifacts.py"
      - "requirements.txt"
      - ".github/workflows/prepare-adbench.yml"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare selected ADBench datasets
        run: |
          python prepare_adbench.py artifacts/adbench \
            --cache-dir .cache/adbench \
            --seed 123 \
            --bins 8 \
            --train-fraction 0.70 \
            --val-fraction 0.15
      - name: Validate generated bundles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from data_artifacts import load_encoded_bundle

          root = Path("artifacts/adbench")
          suite = json.loads((root / "adbench_suite_manifest.json").read_text())
          expected = {
              "annthyroid", "cardio", "cover",
              "mammography", "shuttle", "vowels",
          }
          assert set(suite["datasets"]) == expected

          summary = {}
          for name in sorted(expected):
              data = load_encoded_bundle(root / name)
              assert data.train.y.sum().item() == 0
              assert data.val.y.sum().item() == 0
              assert data.test.y.sum().item() > 0
              assert data.train.x.shape[1] == len(data.physical_dims)
              summary[name] = {
                  "train": len(data.train.x),
                  "val": len(data.val.x),
                  "test": len(data.test.x),
                  "test_anomalies": int(data.test.y.sum().item()),
                  "features": len(data.feature_names),
                  "physical_dims": data.physical_dims,
              }

          (root / "validation_summary.json").write_text(
              json.dumps(summary, indent=2)
          )
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload encoded datasets
        uses: actions/upload-artifact@v4
        with:
          name: adbench-encoded-seed123-bins8
          path: artifacts/adbench
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
