name: focused-adbench-mps-confirmation

on:
  pull_request:
    paths:
      - "confirm_adbench_mps_fast.py"
      - "screen_adbench_mps.py"
      - "mps.py"
      - "dmrg_trainer.py"
      - ".github/workflows/focused-adbench-mps-confirmation.yml"
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "numpy>=1.26" "pandas>=2.0"
      - name: Prepare datasets
        run: python prepare_adbench.py artifacts/adbench --cache-dir .cache/adbench --seed 123 --bins 8
      - name: Focused confirmation
        run: |
          python confirm_adbench_mps_fast.py \
            artifacts/adbench \
            outputs/focused_confirmation \
            --batch-size 1024 \
            --loops 8 \
            --batches-per-loop 12 \
            --seed 123
      - uses: actions/upload-artifact@v4
        with:
          name: focused-adbench-mps-confirmation
          path: outputs/focused_confirmation
          retention-days: 90
