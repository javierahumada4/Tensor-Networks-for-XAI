name: screen-adbench-mps

on:\n  workflow_dispatch:\n
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare datasets
        run: |
          python prepare_adbench.py artifacts/adbench \
            --cache-dir .cache/adbench \
            --seed 123 \
            --bins 8
      - name: Screen common MPS hyperparameters
        run: |
          python screen_adbench_mps.py \
            artifacts/adbench \
            outputs/adbench_screening \
            --batch-size 1024 \
            --loops 5 \
            --batches-per-loop 8 \
            --seed 123
      - name: Upload screening results
        uses: actions/upload-artifact@v4
        with:
          name: adbench-mps-screening
          path: outputs/adbench_screening
          if-no-files-found: error
          retention-days: 90
