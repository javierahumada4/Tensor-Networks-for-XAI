<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="Latin Modern Roman, DejaVu Serif, serif">
  <style>
    .ten   { fill: #3a6ea5; stroke: #1f3f5f; stroke-width: 1.8; }
    .bond  { stroke: #1f3f5f; stroke-width: 1.8; fill: none; }
    .leg   { stroke: #1f3f5f; stroke-width: 1.8; fill: none; }
    .div   { stroke: #e2e2e2; stroke-width: 1.2; }
    .title { fill: #1f3f5f; font-size: 20px; font-weight: bold; }
    .sub   { fill: #777; font-size: 13.5px; font-style: italic; }
  </style>

  <!-- dividers -->
  <line class="div" x1="320" y1="26" x2="320" y2="276"/>
  <line class="div" x1="640" y1="26" x2="640" y2="276"/>

  <!-- ============ MPS ============ -->
  <text class="title" x="160" y="44" text-anchor="middle">MPS</text>
  <line class="bond" x1="70" y1="150" x2="250" y2="150"/>
  <line class="leg" x1="70"  y1="150" x2="70"  y2="180"/>
  <line class="leg" x1="115" y1="150" x2="115" y2="180"/>
  <line class="leg" x1="160" y1="150" x2="160" y2="180"/>
  <line class="leg" x1="205" y1="150" x2="205" y2="180"/>
  <line class="leg" x1="250" y1="150" x2="250" y2="180"/>
  <circle class="ten" cx="70"  cy="150" r="11"/>
  <circle class="ten" cx="115" cy="150" r="11"/>
  <circle class="ten" cx="160" cy="150" r="11"/>
  <circle class="ten" cx="205" cy="150" r="11"/>
  <circle class="ten" cx="250" cy="150" r="11"/>
  <text class="sub" x="160" y="266" text-anchor="middle">cadena unidimensional (1D)</text>

  <!-- ============ PEPS ============ -->
  <text class="title" x="480" y="44" text-anchor="middle">PEPS</text>
  <line class="bond" x1="440" y1="110" x2="520" y2="110"/>
  <line class="bond" x1="440" y1="150" x2="520" y2="150"/>
  <line class="bond" x1="440" y1="190" x2="520" y2="190"/>
  <line class="bond" x1="440" y1="110" x2="440" y2="190"/>
  <line class="bond" x1="480" y1="110" x2="480" y2="190"/>
  <line class="bond" x1="520" y1="110" x2="520" y2="190"/>
  <line class="leg" x1="440" y1="110" x2="429" y2="121"/>
  <line class="leg" x1="480" y1="110" x2="469" y2="121"/>
  <line class="leg" x1="520" y1="110" x2="509" y2="121"/>
  <line class="leg" x1="440" y1="150" x2="429" y2="161"/>
  <line class="leg" x1="480" y1="150" x2="469" y2="161"/>
  <line class="leg" x1="520" y1="150" x2="509" y2="161"/>
  <line class="leg" x1="440" y1="190" x2="429" y2="201"/>
  <line class="leg" x1="480" y1="190" x2="469" y2="201"/>
  <line class="leg" x1="520" y1="190" x2="509" y2="201"/>
  <circle class="ten" cx="440" cy="110" r="10"/>
  <circle class="ten" cx="480" cy="110" r="10"/>
  <circle class="ten" cx="520" cy="110" r="10"/>
  <circle class="ten" cx="440" cy="150" r="10"/>
  <circle class="ten" cx="480" cy="150" r="10"/>
  <circle class="ten" cx="520" cy="150" r="10"/>
  <circle class="ten" cx="440" cy="190" r="10"/>
  <circle class="ten" cx="480" cy="190" r="10"/>
  <circle class="ten" cx="520" cy="190" r="10"/>
  <text class="sub" x="480" y="266" text-anchor="middle">malla bidimensional (2D)</text>

  <!-- ============ TTN ============ -->
  <text class="title" x="800" y="44" text-anchor="middle">TTN</text>
  <line class="bond" x1="800" y1="105" x2="760" y2="150"/>
  <line class="bond" x1="800" y1="105" x2="840" y2="150"/>
  <line class="bond" x1="760" y1="150" x2="735" y2="193"/>
  <line class="bond" x1="760" y1="150" x2="785" y2="193"/>
  <line class="bond" x1="840" y1="150" x2="815" y2="193"/>
  <line class="bond" x1="840" y1="150" x2="865" y2="193"/>
  <line class="leg" x1="735" y1="193" x2="723" y2="226"/>
  <line class="leg" x1="735" y1="193" x2="747" y2="226"/>
  <line class="leg" x1="785" y1="193" x2="773" y2="226"/>
  <line class="leg" x1="785" y1="193" x2="797" y2="226"/>
  <line class="leg" x1="815" y1="193" x2="803" y2="226"/>
  <line class="leg" x1="815" y1="193" x2="827" y2="226"/>
  <line class="leg" x1="865" y1="193" x2="853" y2="226"/>
  <line class="leg" x1="865" y1="193" x2="877" y2="226"/>
  <circle class="ten" cx="800" cy="105" r="10"/>
  <circle class="ten" cx="760" cy="150" r="10"/>
  <circle class="ten" cx="840" cy="150" r="10"/>
  <circle class="ten" cx="735" cy="193" r="10"/>
  <circle class="ten" cx="785" cy="193" r="10"/>
  <circle class="ten" cx="815" cy="193" r="10"/>
  <circle class="ten" cx="865" cy="193" r="10"/>
  <text class="sub" x="800" y="266" text-anchor="middle">árbol jerárquico</text>
</svg>
