<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="Latin Modern Roman, DejaVu Serif, serif">
  <style>
    .tensor { fill: #3a6ea5; stroke: #1f3f5f; stroke-width: 2; }
    .leg  { stroke: #1f3f5f; stroke-width: 2; fill: none; }
    .bond { stroke: #1f3f5f; stroke-width: 2; fill: none; }
    .tname { fill: #1f3f5f; font-size: 20px; font-style: italic; }
    .pidx  { fill: #1f3f5f; font-size: 20px; font-style: italic; }
    .bidx  { fill: #444;   font-size: 17px; font-style: italic; font-family: "DejaVu Serif"; }
    .dim   { fill: #9a9a9a; font-size: 14px; font-style: italic; }
    .dimg  { fill: #9a9a9a; font-size: 14px; font-style: italic; font-family: "DejaVu Serif"; }
    .sub   { font-size: 13px; }
    .subs  { font-size: 11px; }
    .sup   { font-size: 13px; }
  </style>

  <!-- bond links -->
  <line class="bond" x1="120" y1="125" x2="250" y2="125"/>
  <line class="bond" x1="250" y1="125" x2="380" y2="125"/>
  <line class="bond" x1="380" y1="125" x2="470" y2="125"/>
  <line class="bond" x1="560" y1="125" x2="740" y2="125"/>

  <!-- physical legs -->
  <line class="leg" x1="120" y1="125" x2="120" y2="205"/>
  <line class="leg" x1="250" y1="125" x2="250" y2="205"/>
  <line class="leg" x1="380" y1="125" x2="380" y2="205"/>
  <line class="leg" x1="740" y1="125" x2="740" y2="205"/>

  <!-- tensors -->
  <circle class="tensor" cx="120" cy="125" r="20"/>
  <circle class="tensor" cx="250" cy="125" r="20"/>
  <circle class="tensor" cx="380" cy="125" r="20"/>
  <circle class="tensor" cx="740" cy="125" r="20"/>

  <!-- ellipsis -->
  <text x="515" y="133" text-anchor="middle" font-size="28" fill="#1f3f5f">···</text>

  <!-- tensor names -->
  <text class="tname" x="120" y="82" text-anchor="middle">A<tspan class="sup" dy="-9">(1)</tspan></text>
  <text class="tname" x="250" y="82" text-anchor="middle">A<tspan class="sup" dy="-9">(2)</tspan></text>
  <text class="tname" x="380" y="82" text-anchor="middle">A<tspan class="sup" dy="-9">(3)</tspan></text>
  <text class="tname" x="740" y="82" text-anchor="middle">A<tspan class="sup" dy="-9">(N)</tspan></text>

  <!-- physical index labels -->
  <text class="pidx" x="120" y="234" text-anchor="middle">v<tspan class="sub" dy="6">1</tspan></text>
  <text class="pidx" x="250" y="234" text-anchor="middle">v<tspan class="sub" dy="6">2</tspan></text>
  <text class="pidx" x="380" y="234" text-anchor="middle">v<tspan class="sub" dy="6">3</tspan></text>
  <text class="pidx" x="740" y="234" text-anchor="middle">v<tspan class="sub" dy="6">N</tspan></text>

  <!-- physical dimension labels (per site, gray) -->
  <text class="dim" x="131" y="172" text-anchor="start">d<tspan class="subs" dy="4">1</tspan></text>
  <text class="dim" x="261" y="172" text-anchor="start">d<tspan class="subs" dy="4">2</tspan></text>
  <text class="dim" x="391" y="172" text-anchor="start">d<tspan class="subs" dy="4">3</tspan></text>
  <text class="dim" x="751" y="172" text-anchor="start">d<tspan class="subs" dy="4">N</tspan></text>

  <!-- bond index labels (above line, dark) -->
  <text class="bidx" x="185" y="112" text-anchor="middle">α<tspan class="sub" dy="5">1</tspan></text>
  <text class="bidx" x="315" y="112" text-anchor="middle">α<tspan class="sub" dy="5">2</tspan></text>
  <text class="bidx" x="632" y="112" text-anchor="start">α</text>
  <text class="bidx subs" x="644" y="118" text-anchor="start">N−1</text>

  <!-- bond dimension labels (below line, gray) -->
  <text class="dimg" x="185" y="148" text-anchor="middle">D<tspan class="subs" dy="4">1</tspan></text>
  <text class="dimg" x="315" y="148" text-anchor="middle">D<tspan class="subs" dy="4">2</tspan></text>
  <text class="dimg" x="634" y="148" text-anchor="start">D</text>
  <text class="dimg subs" x="646" y="153" text-anchor="start">N−1</text>
</svg>
