name: audit-shuttle-interaction-numerics

on:
  pull_request:
    paths:
      - "mps_interactions.py"
      - ".github/workflows/audit-shuttle-interactions.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "numpy>=1.26" "pandas>=2.0"
      - name: Prepare encoded data
        run: |
          python prepare_adbench.py artifacts/adbench \
            --cache-dir .cache/adbench \
            --seed 123 \
            --bins 8
      - name: Download frozen shuttle model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(python -c 'import json; print(json.load(open("final_training_manifest.json"))["workflow_run_id"])')
          mkdir -p outputs/final/shuttle
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "final-mps-shuttle" \
            --dir outputs/final/shuttle
      - name: Recompute final shuttle interactions
        run: |
          python run_interaction_experiments.py \
            artifacts/adbench \
            shuttle \
            outputs/final/shuttle \
            outputs/shuttle_audit \
            --max-samples 100 \
            --max-order 9 \
            --seed 123
      - name: Report full-order numerical residual
        run: |
          python - <<'PY'
          import csv, json
          rows=list(csv.DictReader(open("outputs/shuttle_audit/samples.csv")))
          vals=[float(r["c_at_max_order"]) for r in rows]
          report={
              "n": len(vals),
              "median_c_full": sorted(vals)[len(vals)//2],
              "max_c_full": max(vals),
              "count_gt_1e-8": sum(v > 1e-8 for v in vals),
              "count_gt_1e-6": sum(v > 1e-6 for v in vals),
          }
          open("outputs/shuttle_audit/numerical_audit.json","w").write(
              json.dumps(report,indent=2)
          )
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shuttle-interaction-numerical-audit
          path: outputs/shuttle_audit
          retention-days: 30
