name: screen-adbench-mps-stage2

on:
  pull_request:
    paths:
      - "screen_adbench_mps_stage2.py"
      - "screen_adbench_mps.py"
      - "mps.py"
      - "dmrg_trainer.py"
      - ".github/workflows/screen-adbench-mps-stage2.yml"
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare datasets
        run: python prepare_adbench.py artifacts/adbench --cache-dir .cache/adbench --seed 123 --bins 8
      - name: Run stage-2 screening
        run: |
          python screen_adbench_mps_stage2.py \
            artifacts/adbench \
            outputs/adbench_screening_stage2 \
            --batch-size 1024 \
            --loops 5 \
            --batches-per-loop 8 \
            --seed 123
      - name: Upload stage-2 results
        uses: actions/upload-artifact@v4
        with:
          name: adbench-mps-screening-stage2
          path: outputs/adbench_screening_stage2
          retention-days: 90
